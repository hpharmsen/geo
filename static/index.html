<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>GEO-meter</title>
<meta name="description" content="Meet hoe vaak en waar AI-modellen (ChatGPT, Gemini, Perplexity, Claude) jouw merk noemen." />
<link rel="icon" href="/static/favicon.png" type="image/png" />
<meta name="twitter:card" content="summary" />
<!-- Branding: teksten in brand.js, kleuren/lettertype in theme.css -->
<script src="/static/brand.js"></script>
<link rel="stylesheet" href="/static/theme.css" />
<style>
  body { background: var(--bg-soft); }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 var(--s-5) var(--s-10); }

  /* ---- Header (indigo full-bleed) ---- */
  .hero { background: var(--indigo-900); color: var(--white); position: relative; overflow: hidden; }
  .hero-inner { max-width: 880px; margin: 0 auto; padding: var(--s-8) var(--s-5) var(--s-7); position: relative; }
  .hero .eyebrow { color: var(--yellow-500); margin-bottom: var(--s-3); }
  .hero h1 { color: var(--white); font-size: var(--fs-display-md); line-height: var(--lh-display); margin: 0 0 var(--s-4); }
  .hero h1 .pink { color: var(--pink-500); }
  .hero .lede { color: var(--indigo-100); max-width: 58ch; }
  @media (max-width: 640px) { .hero h1 { font-size: 44px; } }

  /* ---- Cards ---- */
  .card { background: var(--white); border: 1px solid var(--border); border-radius: var(--r-lg); padding: var(--s-6); box-shadow: var(--shadow-md); margin-top: var(--s-6); }
  .card > h2:first-child { margin-top: 0; }

  /* ---- Form ---- */
  label { display: block; font-family: var(--font-body); font-size: var(--fs-xs); font-weight: 700; color: var(--indigo-900); margin: var(--s-5) 0 var(--s-2); letter-spacing: var(--ls-caps); text-transform: uppercase; }
  label:first-of-type { margin-top: 0; }
  label .hint { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--gray-500); margin-left: 6px; }
  input, select {
    width: 100%; box-sizing: border-box; padding: 14px 16px;
    border: 2px solid var(--indigo-900); border-radius: var(--r-sm);
    font-family: var(--font-body); font-size: 15px; color: var(--indigo-900); background: #fff;
  }
  input::placeholder { color: var(--gray-500); }
  input:focus, select:focus { outline: none; border-color: var(--pink-600); box-shadow: 0 0 0 3px rgba(231,22,116,.18); }
  .row { display: flex; gap: var(--s-5); }
  .row > div { flex: 1; }

  /* ---- Verplicht/optioneel-markering ---- */
  .req { color: var(--pink-600); font-weight: 800; margin-left: 2px; }
  .opt { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--gray-500); margin-left: 6px; }
  .form-legend { font-size: var(--fs-sm); color: var(--gray-700); margin: 0 0 var(--s-5); }
  .form-legend .req { font-size: var(--fs-md); }

  /* ---- Optie-blok (diepte-analyses) ---- */
  .option-box { margin-top: var(--s-6); background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--r-md); padding: var(--s-5); }
  .check-row { display: flex; align-items: flex-start; gap: 12px; margin: 0; cursor: pointer; text-transform: none; letter-spacing: 0; }
  .check-row input[type=checkbox] { width: 20px; height: 20px; margin: 1px 0 0; flex: none; accent-color: var(--pink-600); cursor: pointer; }
  .check-label { font-weight: 700; color: var(--indigo-900); font-size: var(--fs-md); }
  .check-sub { display: block; font-weight: 400; color: var(--gray-700); font-size: var(--fs-sm); margin-top: 4px; }
  .boek-extra { margin-top: var(--s-5); padding-top: var(--s-5); border-top: 1px solid var(--border); }
  .boek-extra label { margin-top: 0; }

  /* ---- Buttons ---- */
  .btn { font-family: var(--font-body); font-weight: 700; font-size: 15px; padding: 14px 22px; border-radius: var(--r-pill); border: 0; cursor: pointer; transition: transform var(--t-fast) var(--ease-out), box-shadow var(--t-fast) var(--ease-out), background var(--t-fast); }
  .btn-primary { background: var(--pink-600); color: #fff; box-shadow: 4px 4px 0 var(--indigo-900); margin-top: var(--s-6); }
  .btn-primary:hover { background: var(--pink-700); transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--indigo-900); }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: 4px 4px 0 var(--indigo-900); }
  .btn-ghost { background: transparent; color: var(--indigo-900); border: 2px solid var(--indigo-900); padding: 10px 18px; font-size: 14px; }
  .btn-ghost:hover { background: var(--indigo-900); color: #fff; }

  .hidden { display: none; }

  /* ---- Progress ---- */
  .progress-bar { height: 12px; background: var(--indigo-100); border-radius: var(--r-pill); overflow: hidden; margin: var(--s-4) 0; }
  .progress-fill { height: 100%; background: var(--pink-600); width: 0%; transition: width .4s var(--ease-out); }

  /* ---- KPI ---- */
  .kpi-grid { display: flex; gap: var(--s-5); flex-wrap: wrap; }
  .kpi { flex: 1; min-width: 160px; background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--r-md); padding: var(--s-5); }
  .kpi .top { font-family: var(--font-body); font-size: var(--fs-xs); font-weight: 700; letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--pink-600); }
  .kpi .big { font-family: var(--font-display); font-size: 56px; line-height: 1; color: var(--indigo-900); margin: var(--s-2) 0 var(--s-1); }
  .kpi .sub { font-size: var(--fs-sm); color: var(--gray-500); }

  /* ---- Tables ---- */
  table { width: 100%; border-collapse: collapse; margin-top: var(--s-3); font-size: var(--fs-sm); }
  th { text-align: left; background: var(--indigo-900); color: #fff; padding: 10px 12px; font-weight: 700; font-size: var(--fs-xs); letter-spacing: var(--ls-caps); text-transform: uppercase; }
  th:first-child { border-top-left-radius: var(--r-sm); }
  th:last-child { border-top-right-radius: var(--r-sm); }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--indigo-900); }
  tr:nth-child(even) td { background: var(--bg-soft); }
  .bar { display: inline-block; height: 12px; background: var(--pink-500); border-radius: var(--r-pill); vertical-align: middle; }
  .bar.self { background: var(--indigo-900); }
  .tag-you { display: inline-block; background: var(--yellow-500); color: var(--indigo-900); font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: var(--r-pill); margin-left: 8px; }

  /* ---- Callout strips ---- */
  .strip { border-radius: var(--r-md); padding: var(--s-4) var(--s-5); margin-bottom: var(--s-5); font-size: var(--fs-sm); }
  .strip-yellow { background: var(--yellow-200); border: 2px solid var(--yellow-500); color: var(--indigo-900); }
  .strip-error { background: var(--pink-100); border: 2px solid var(--pink-500); color: var(--pink-700); }

  /* ---- Meet-notitie (rustige melding bij echte mislukkingen) ---- */
  .meet-notitie { margin-top: var(--s-4); font-size: var(--fs-sm); color: var(--gray-700);
    background: var(--bg-soft); border-left: 3px solid var(--gray-300);
    border-radius: var(--r-sm); padding: 10px 14px; }

  /* ---- Uitleg-blok ---- */
  .explain { background: var(--indigo-100); border-radius: var(--r-md); padding: var(--s-5); margin-top: var(--s-5); font-size: var(--fs-sm); }
  .explain-item { margin-bottom: var(--s-3); color: var(--gray-700); line-height: 1.5; }
  .explain-item:last-child { margin-bottom: 0; }
  .explain-item b { color: var(--indigo-900); }

  /* ---- Boek-analyses (diepte) ---- */
  details.analyse { border: 1px solid var(--border); border-radius: var(--r-md); margin-top: var(--s-3); overflow: hidden; }
  details.analyse > summary { cursor: pointer; padding: 14px var(--s-5); font-weight: 700; color: var(--indigo-900); background: var(--bg-soft); list-style: none; }
  details.analyse > summary::-webkit-details-marker { display: none; }
  details.analyse > summary::before { content: "+ "; color: var(--pink-600); font-weight: 800; }
  details.analyse[open] > summary::before { content: "– "; }
  details.analyse[open] > summary { border-bottom: 1px solid var(--border); }
  .analyse-body { padding: var(--s-5); font-size: var(--fs-sm); line-height: 1.6; color: var(--gray-900); }
  .analyse-uitleg { color: var(--gray-700); font-size: var(--fs-sm); margin: 0 0 var(--s-3); }
  details.prompt-toggle { border: 1px dashed var(--indigo-300); border-radius: var(--r-sm); margin-bottom: var(--s-4); background: var(--bg-soft); }
  details.prompt-toggle > summary { cursor: pointer; padding: 8px 12px; font-size: var(--fs-xs); font-weight: 700; letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--indigo-700); list-style: none; }
  details.prompt-toggle > summary::-webkit-details-marker { display: none; }
  details.prompt-toggle > summary::before { content: "▸ "; }
  details.prompt-toggle[open] > summary::before { content: "▾ "; }
  /* Genoemd = roze accent; niet genoemd = grijs en vervaagd (scanbaar) */
  details.prompt-toggle.hit { border: 1px solid var(--pink-300); background: var(--pink-100); }
  details.prompt-toggle.hit > summary { color: var(--pink-700); }
  details.prompt-toggle.hit > summary b { color: var(--pink-700); }
  details.prompt-toggle.miss { opacity: 0.7; }
  details.prompt-toggle.miss > summary { color: var(--gray-500); }
  .prompt-text { padding: 0 12px 12px; white-space: pre-wrap; font-size: 13px; color: var(--gray-900); line-height: 1.6; }
  mark.hl-merk { background: var(--pink-300); color: var(--indigo-900); padding: 0 3px; border-radius: 3px; font-weight: 700; }
  mark.hl-conc { background: var(--indigo-100); color: var(--indigo-900); padding: 0 3px; border-radius: 3px; }
  .analyse-body hr { border: 0; border-top: 1px solid var(--border); margin: var(--s-3) 0 var(--s-4); }
  .analyse-body h1, .analyse-body h2, .analyse-body h3 { font-family: var(--font-body); text-transform: none; letter-spacing: 0; color: var(--indigo-900); font-size: var(--fs-md); margin: var(--s-4) 0 var(--s-2); }
  .analyse-body table { font-size: 13px; }
  .analyse-body th { background: var(--indigo-700); }
  .analyse-body pre { white-space: pre-wrap; font-family: var(--font-body); margin: 0; }

  .toolbar { display: flex; gap: var(--s-3); align-items: center; flex-wrap: wrap; margin-top: var(--s-3); }
  textarea { width: 100%; box-sizing: border-box; height: 300px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; border: 2px solid var(--indigo-900); border-radius: var(--r-sm); padding: var(--s-4); margin-top: var(--s-4); color: var(--indigo-900); }
  h2 { font-size: var(--fs-h3); margin: var(--s-6) 0 var(--s-3); }
  .section-meta { color: var(--gray-500); font-size: var(--fs-sm); margin-top: 0; }
</style>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="eyebrow" id="brand-eyebrow"></div>
    <h1 id="brand-titel"></h1>
    <p class="lede" id="brand-tagline"></p>
  </div>
</header>

<div class="wrap">
  <!-- FORMULIER -->
  <div class="card" id="form-card">
    <p class="form-legend">Velden met <span class="req">*</span> zijn verplicht. De rest is optioneel.</p>

    <label>Merknaam <span class="req">*</span> <span class="hint">— exact zoals klanten je zoeken</span></label>
    <input id="merknaam" placeholder="Jouw merk" />

    <label>Categorie <span class="req">*</span> <span class="hint">— waar wil je voor gevonden worden?</span></label>
    <input id="categorie" placeholder="Marketing" />

    <label>Website-URL <span class="opt">optioneel</span> <span class="hint">— aanbevolen: voor citatie-detectie en de tekst-analyse</span></label>
    <input id="url" placeholder="https://jouwwebsite.nl" />

    <div class="row">
      <div>
        <label>Markt</label>
        <input id="markt" value="Nederland" />
      </div>
      <div>
        <label>Taal</label>
        <select id="taal">
          <option value="nl">Nederlands</option>
          <option value="en">Engels</option>
        </select>
      </div>
    </div>

    <label>Concurrenten <span class="opt">optioneel</span> <span class="hint">— max 3, gescheiden door komma's</span></label>
    <input id="concurrenten" placeholder="Concurrent 1, Concurrent 2, Concurrent 3" />

    <label>Doelgroep <span class="opt">optioneel</span> <span class="hint">— voor wie is het bedoeld? Leeg = algemene vragen</span></label>
    <input id="doelgroep" placeholder="bv. het MKB, grote organisaties, zzp'ers, marketeers" />

    <label>Meetmodus <span class="hint">— hoe de AI's bevraagd worden</span></label>
    <select id="modus">
      <option value="zoeken" selected>Met live zoeken — realistisch (wat een echte gebruiker ziet)</option>
      <option value="kaal">Uit het geheugen — kale model, geen internet</option>
      <option value="beide">Beide — vergelijk geheugen vs. zoeken (langzamer)</option>
    </select>

    <label>Aantal runs per vraag <span class="hint">— meer = betrouwbaarder, maar langzamer</span></label>
    <select id="runs">
      <option value="5" selected>5 (aanbevolen)</option>
      <option value="3">3 (sneller)</option>
      <option value="1">1 (test)</option>
    </select>

    <div class="option-box">
      <label class="check-row">
        <input type="checkbox" id="boek" checked />
        <span class="check-label">Diepte-analyses meedraaien
          <span class="check-sub">6 uitgebreide GEO-analyses (profiel, benchmark, merk, sentiment, persona, dvv).</span>
        </span>
      </label>
      <div id="boek-extra" class="boek-extra">
        <label>Landingspagina voor de tekst-analyse <span class="opt">optioneel</span></label>
        <span class="hint" style="display:block; margin:0 0 8px;">De pagina die de dvv-analyse beoordeelt. Laat leeg om je hoofd-URL te gebruiken.</span>
        <input id="landingspagina" placeholder="https://jouwwebsite.nl/" />
      </div>
    </div>

    <button class="btn btn-primary" id="start">Meting starten</button>
  </div>

  <!-- VOORTGANG -->
  <div class="card hidden" id="progress-card">
    <h2>Meten…</h2>
    <p class="section-meta" id="progress-text">De meting draait. Dit kan een paar minuten duren.</p>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div id="progress-note" class="strip strip-yellow hidden" style="margin: var(--s-4) 0 0;"></div>
  </div>

  <!-- RESULTAAT -->
  <div class="hidden" id="result"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);

// ---- Branding toepassen (waarden uit brand.js) ----
(function applyBrand() {
  const b = window.BRAND || {};
  if (b.paginaTitel) document.title = b.paginaTitel;
  const eyebrow = $("brand-eyebrow");
  if (eyebrow) {
    if (b.eyebrow) eyebrow.textContent = b.eyebrow;
    else eyebrow.style.display = "none";
  }
  const titel = $("brand-titel");
  if (titel) {
    titel.textContent = b.titel || "GEO-";
    if (b.titelAccent) {
      const span = document.createElement("span");
      span.className = "pink";
      span.textContent = b.titelAccent;
      titel.appendChild(span);
    }
  }
  const tagline = $("brand-tagline");
  if (tagline && b.tagline) tagline.textContent = b.tagline;
  if (b.voorbeeldMerk) $("merknaam").placeholder = b.voorbeeldMerk;
  if (b.voorbeeldWebsite) {
    $("url").placeholder = b.voorbeeldWebsite;
    $("landingspagina").placeholder = b.voorbeeldWebsite.replace(/\/?$/, "/");
  }
})();

$("start").addEventListener("click", startMeting);
const _m = document.createElement("script");
_m.src = "https://cdn.jsdelivr.net/npm/marked/marked.min.js";
document.head.appendChild(_m);

// Landingspagina-veld alleen tonen als de boek-analyses aanstaan.
const _boekToggle = () => { $("boek-extra").style.display = $("boek").checked ? "block" : "none"; };
$("boek").addEventListener("change", _boekToggle);
_boekToggle();

// Landingspagina-placeholder spiegelt de ingevulde Website-URL (= wat er gebruikt wordt als je 'm leeg laat).
const _lpDefault = $("landingspagina").placeholder;
const _syncLp = () => {
  const v = $("url").value.trim();
  $("landingspagina").placeholder = v || _lpDefault;
};
$("url").addEventListener("input", _syncLp);
_syncLp();

async function startMeting() {
  const merknaam = $("merknaam").value.trim();
  const categorie = $("categorie").value.trim();
  if (!merknaam || !categorie) {
    alert("Vul minimaal merknaam en categorie in.");
    return;
  }
  const body = {
    merknaam,
    url: $("url").value.trim(),
    categorie,
    markt: $("markt").value.trim() || "Nederland",
    taal: $("taal").value,
    concurrenten: $("concurrenten").value.split(",").map(s => s.trim()).filter(Boolean).slice(0, 3),
    doelgroep: $("doelgroep").value.trim(),
    runs_per_prompt: parseInt($("runs").value, 10),
    boek_analyses: $("boek").checked,
    landingspagina: $("landingspagina").value.trim(),
    modus: $("modus").value,
  };
  $("start").disabled = true;
  $("progress-card").classList.remove("hidden");
  $("result").classList.add("hidden");
  const res = await fetch("/api/measure", {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body),
  });
  const { meting_id } = await res.json();
  poll(meting_id);
}

async function poll(id) {
  const s = await (await fetch(`/api/measure/${id}/status`)).json();
  if (s.total > 0) {
    const pct = Math.round(100 * s.done / s.total);
    $("progress-fill").style.width = pct + "%";
    $("progress-text").textContent = `Bezig: ${s.done} van ${s.total} AI-antwoorden geanalyseerd (${pct}%).`;
  }
  const noteEl = $("progress-note");
  if (noteEl) {
    if (s.note) { noteEl.textContent = s.note; noteEl.classList.remove("hidden"); }
    else { noteEl.classList.add("hidden"); }
  }
  if (s.status === "done") {
    const result = await (await fetch(`/api/measure/${id}/result`)).json();
    const md = await (await fetch(`/api/measure/${id}/report`)).text();
    render(id, result, md);
  } else if (s.status === "error") {
    $("progress-text").innerHTML = `<span class="strip strip-error" style="display:block">Er ging iets mis: ${s.error || "onbekende fout"}</span>`;
    $("start").disabled = false;
  } else {
    setTimeout(() => poll(id), 1500);
  }
}

const pct = (x) => x == null ? "n.v.t." : Math.round(x * 100) + "%";
const labels = { openai: "ChatGPT (OpenAI)", perplexity: "Perplexity", gemini: "Gemini (Google)", anthropic: "Claude (Anthropic)" };

function highlight(text, merk, concurrenten) {
  let h = esc(text || "");
  const wrap = (naam, cls) => {
    if (!naam) return;
    const re = new RegExp("(" + naam.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
    h = h.replace(re, `<mark class="${cls}">$1</mark>`);
  };
  wrap(merk, "hl-merk");
  for (const c of (concurrenten || [])) wrap(c, "hl-conc");
  return h;
}

function antwoordenBlok(result, modus) {
  const items = (result.antwoorden || []).filter(a => a.modus === modus);
  if (!items.length) return "";
  const order = {};
  (result.promptset || []).forEach((p, i) => order[p] = i);
  const prompts = [...new Set(items.map(a => a.prompt))].sort((a, b) => (order[a] ?? 99) - (order[b] ?? 99));
  const concNamen = Object.keys((result.concurrenten_per_modus || {})[modus] || {});

  let html = `<details class="analyse" style="margin-top:var(--s-5)"><summary>Bekijk de antwoorden (wat de AI echt zei)</summary><div class="analyse-body">`;
  for (const prompt of prompts) {
    html += `<p style="font-weight:700;color:var(--indigo-900);margin:var(--s-4) 0 6px">${esc(prompt)}</p>`;
    const provItems = items.filter(x => x.prompt === prompt)
      .sort((a, b) => (b.mentioned_count || 0) - (a.mentioned_count || 0));  // hits bovenaan
    for (const a of provItems) {
      const n = a.mentioned_count || 0;
      const hit = n > 0;
      const klasse = !a.runs ? "miss" : (hit ? "hit" : "miss");
      const freq = a.runs ? `genoemd in <b>${n}/${a.runs}</b> runs` : "geen geslaagde runs";
      const schoon = (a.voorbeeld_text || "").replace(/\*\*/g, "").replace(/^#+\s/gm, "");
      const body = a.voorbeeld_error ? `<span class="muted">(call mislukt)</span>` : highlight(schoon, result.merknaam, concNamen);
      html += `<details class="prompt-toggle ${klasse}"><summary>${labels[a.provider] || a.provider} — ${freq}</summary><div class="prompt-text" style="font-family:var(--font-body)">${body}</div></details>`;
    }
  }
  html += `</div></details>`;
  return html;
}

function modusBlok(result, modus) {
  const t = (result.totaal_per_modus || {})[modus] || {};
  const rows = (result.rows || []).filter(r => r.modus === modus);
  const conc = (result.concurrenten_per_modus || {})[modus] || {};
  const toonPositie = !!result.heeft_concurrenten;
  let html = "";

  html += `<div class="kpi-grid">`;
  html += kpi("Mention share", pct(t.mention_share), "spontaan genoemd");
  html += kpi("Citatie share", pct(t.citatie_share), "eigen site als bron");
  if (toonPositie) html += kpi("Gemiddelde positie", t.gem_positie == null ? "—" : t.gem_positie, "volgorde t.o.v. concurrenten");
  html += `</div>`;

  if (toonPositie) {
    html += `<table style="margin-top:var(--s-5)"><tr><th>AI-model</th><th>Mention</th><th>Citatie</th><th>Gemiddelde positie</th></tr>`;
    for (const agg of rows) {
      html += `<tr><td>${labels[agg.provider] || agg.provider}</td><td>${pct(agg.mention_share)}</td><td>${pct(agg.citatie_share)}</td><td>${agg.gem_positie == null ? "—" : agg.gem_positie}</td></tr>`;
    }
    html += `</table>`;
  } else {
    html += `<table style="margin-top:var(--s-5)"><tr><th>AI-model</th><th>Mention</th><th>Citatie</th></tr>`;
    for (const agg of rows) {
      html += `<tr><td>${labels[agg.provider] || agg.provider}</td><td>${pct(agg.mention_share)}</td><td>${pct(agg.citatie_share)}</td></tr>`;
    }
    html += `</table>`;
  }

  // Rustige melding alléén bij echte mislukkingen (na alle retries niet gelukt).
  const totFout = rows.reduce((s, r) => s + (r.errors || 0), 0);
  if (totFout > 0) {
    const wie = rows.filter(r => r.errors > 0).map(r => `${labels[r.provider] || r.provider} (${r.errors})`).join(", ");
    html += `<p class="meet-notitie">Let op: ${totFout} losse meting${totFout > 1 ? "en zijn" : " is"} na herhaald proberen niet gelukt en tel${totFout > 1 ? "len" : "t"} niet mee in de cijfers — bij ${wie}. De rest van de meting is gewoon geldig.</p>`;
  }

  const compRows = [[result.merknaam, t.mention_share || 0, true], ...Object.entries(conc).map(([k, v]) => [k, v, false])];
  compRows.sort((a, b) => b[1] - a[1]);
  if (compRows.length > 1) {
    html += `<h3 style="margin-top:var(--s-5)">Positie t.o.v. concurrenten</h3><table><tr><th>Merk</th><th style="width:55%">Mention share</th></tr>`;
    for (const [naam, share, isMerk] of compRows) {
      const w = Math.round((share || 0) * 100);
      const naamCell = isMerk ? `<b>${naam}</b><span class="tag-you">jij</span>` : naam;
      html += `<tr><td>${naamCell}</td><td><span class="bar ${isMerk ? "self" : ""}" style="width:${Math.max(w, 2)}%"></span> ${w}%</td></tr>`;
    }
    html += `</table>`;
  }

  html += antwoordenBlok(result, modus);
  return html;
}

function render(id, result, md) {
  $("progress-card").classList.add("hidden");
  $("start").disabled = false;
  const modi = result.modi || [];
  const modusLabels = result.modus_labels || {};

  let html = `<div class="card">`;
  html += `<h2>Resultaat — ${result.merknaam}</h2>`;
  html += `<p class="section-meta">Meting van ${result.datum} · ${result.runs_per_prompt} runs per vraag · ${result.promptset.length} vragen</p>`;

  if (result.demo_modus) {
    html += `<div class="strip strip-yellow"><b>Demo-modus:</b> niet alle API-keys waren aanwezig, dus (een deel van) deze cijfers komt uit nep-antwoorden. Illustratief, niet representatief.</div>`;
  }

  // Uitleg-blok
  html += `<div class="explain">
    <div class="explain-item"><b>Mention share — hoe vaak word je spontaan genoemd?</b><br>
      We stellen vragen over je categorie <i>zonder je merknaam erin</i> (bv. "Wat is de beste CRM-software?"). Het aandeel van de metingen waarin de AI je merk uit zichzelf noemt.</div>
    <div class="explain-item"><b>Citatie share — gebruikt de AI je site als bron?</b><br>
      Aandeel van de antwoorden waarin de AI naar jouw eigen website verwijst (link of vermelding van je domein), niet alleen je naam.</div>`;
  if (result.heeft_concurrenten) {
    html += `<div class="explain-item"><b>Gemiddelde positie — vóór of na je concurrenten?</b><br>
      De volgorde waarin je verschijnt t.o.v. de concurrenten die jíj hebt opgegeven. <b>1,0</b> = steevast vóór je concurrenten genoemd. Het zegt dus iets over je relatieve positie, niet of de AI je "de beste" vindt.</div>`;
  } else {
    html += `<div class="explain-item"><b>Geen positie getoond:</b> je hebt geen concurrenten opgegeven. Positie is alleen zinvol t.o.v. concurrenten — vul ze in om dit te zien.</div>`;
  }
  html += `<div class="explain-item"><b>Bewijs:</b> klik onderaan elk blok op <i>"Bekijk de antwoorden"</i> om de échte AI-antwoorden te zien, met jouw merk gemarkeerd.</div>`;
  if (modi.length > 1) {
    html += `<div class="explain-item"><b>Twee modi vergeleken:</b> <i>Uit het geheugen</i> = wat de AI weet zonder te zoeken (ben je een bekende entiteit?). <i>Met live zoeken</i> = de AI zoekt op het web (wat een echte gebruiker ziet).</div>`;
  } else if (modi[0] === "zoeken") {
    html += `<div class="explain-item"><b>Modus: Met live zoeken</b> — de AI's zochten tijdens het antwoord op het web. Dit lijkt het meest op wat een echte gebruiker ziet.</div>`;
  } else if (modi[0] === "kaal") {
    html += `<div class="explain-item"><b>Modus: Uit het geheugen</b> — de AI's antwoordden zonder te zoeken, puur uit hun trainingsdata.</div>`;
  }
  html += `</div>`;

  // Eén blok per modus
  for (const m of modi) {
    if (modi.length > 1) html += `<h2>${modusLabels[m] || m}</h2>`;
    else html += `<h2>Per AI-model</h2>`;
    html += modusBlok(result, m);
  }
  html += `</div>`;

  // Diepte-analyses uit het boek
  if (result.boek_analyses && result.boek_analyses.length) {
    html += `<div class="card"><h2>${(window.BRAND && window.BRAND.analyseTitel) || "Diepte-analyses"}</h2>`;
    html += `<p class="section-meta">Zes uitgebreide GEO-analyses uit het boek, uitgevoerd door ${result.boek_model || "de AI"} voor ${result.merknaam}. Klik een analyse open om te lezen.</p>`;
    for (const a of result.boek_analyses) {
      const antwoordHtml = a.error
        ? `<span class="strip strip-error" style="display:block">Niet gelukt: ${a.error}</span>`
        : renderMd(a.antwoord);
      let bodyHtml = "";
      if (a.uitleg) bodyHtml += `<p class="analyse-uitleg">${a.uitleg}</p>`;
      if (a.prompt) bodyHtml += `<details class="prompt-toggle"><summary>Toon de exacte vraag aan de AI</summary><div class="prompt-text">${esc(a.prompt)}</div></details>`;
      bodyHtml += `<hr />` + antwoordHtml;
      html += `<details class="analyse"><summary>${a.titel}</summary><div class="analyse-body">${bodyHtml}</div></details>`;
    }
    html += `</div>`;
  }

  html += `<div class="card"><h2>Rapport voor de klant</h2>`;
  html += `<p class="section-meta">Het markdown-rapport hieronder kun je als prompt plakken om er een gebrand PDF van te maken.</p>`;
  html += `<div class="toolbar">
      <button class="btn btn-ghost" id="copy-btn">Kopieer rapport</button>
      <a href="/api/measure/${id}/report" download="rapport-${id}.md"><button class="btn btn-ghost">Download .md</button></a>
      <button class="btn btn-ghost" id="toggle-md">Toon/verberg tekst</button>
    </div>`;
  html += `<textarea id="md" class="hidden" readonly></textarea></div>`;
  html += `<div style="margin-top:32px"><button class="btn btn-ghost" onclick="location.reload()">Nieuwe meting</button></div>`;

  const box = $("result");
  box.innerHTML = html;
  box.classList.remove("hidden");
  $("md").value = md;
  $("copy-btn").addEventListener("click", () => {
    navigator.clipboard.writeText(md).then(() => { $("copy-btn").textContent = "Gekopieerd ✓"; });
  });
  $("toggle-md").addEventListener("click", () => $("md").classList.toggle("hidden"));
  box.scrollIntoView({ behavior: "smooth" });
}

function kpi(top, big, sub) {
  return `<div class="kpi"><div class="top">${top}</div><div class="big">${big}</div><div class="sub">${sub}</div></div>`;
}

function esc(text) {
  return (text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderMd(text) {
  if (window.marked) {
    try { return window.marked.parse(text); } catch (e) { /* val terug op pre */ }
  }
  return `<pre>${esc(text)}</pre>`;
}
</script>
</body>
</html>
